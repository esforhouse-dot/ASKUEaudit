<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АСКУЭ · Вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg:#e9edf3; --card:#e9edf3; --card2:#dde3ec; --line:#d3dbe6; --tx:#262a33;
    --muted:#5b6472; --accent:#008dd2; --err:#c93a56; --focus-ring:#00577f;
    --shadow-light:#ffffff; --shadow-dark:#b7c1d0;
    --raised: 7px 7px 15px var(--shadow-dark), -7px -7px 15px var(--shadow-light);
    --raised-sm: 4px 4px 9px var(--shadow-dark), -4px -4px 9px var(--shadow-light);
    --inset-sm: inset 2px 2px 6px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light);
    --card-border: 1px solid transparent;
    --ease-out: cubic-bezier(.23,1,.32,1);
    --font-body:'Golos Text',-apple-system,Segoe UI,Roboto,sans-serif;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg:#1e1f22; --card:#1e1f22; --card2:#1a1b1e; --line:#303236; --tx:#eef0f2;
    --muted:#96999f; --accent:#008dd2; --err:#e35d5d; --focus-ring:#a2d9f7;
    --shadow-light:#2b2d31; --shadow-dark:#131316;
    --raised: 7px 7px 16px var(--shadow-dark), -7px -7px 16px var(--shadow-light);
    --raised-sm: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
    --inset-sm: inset 2px 2px 6px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light);
    --card-border: 1px solid rgba(255,255,255,.05);
  }
  * { box-sizing:border-box; }
  html, body { background:var(--bg); }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--tx); font:14px/1.5 var(--font-body); transition:background 200ms ease, color 200ms ease; }
  @media (forced-colors: active) { .box, input, button, .theme-toggle-btn { box-shadow:none !important; border:1px solid CanvasText !important; } }
  /* Кнопка темы привязана к самой карточке (position:absolute внутри .box), а не к углу
     вьюпорта (position:fixed) — иначе на низком экране (альбомная ориентация телефона) она
     перекрывала бы карточку входа, т.к. центрирование .box через flex не учитывает fixed-элементы. */
  .theme-toggle-btn { position:absolute; top:12px; right:12px; width:38px; height:38px; padding:0;
    display:flex; align-items:center; justify-content:center; background:var(--card2); color:var(--muted);
    border:var(--card-border); border-radius:10px; box-shadow:var(--raised-sm); cursor:pointer; }
  .theme-toggle-btn:hover { color:var(--tx); }
  .theme-toggle-btn:active { box-shadow:var(--inset-sm); }
  .theme-toggle-btn svg { width:16px; height:16px; }
  .box { position:relative; width:100%; max-width:340px; padding:28px; background:var(--card);
    border:var(--card-border); border-radius:16px; box-shadow:var(--raised); }
  h1 { font-size:18px; margin:0 0 20px; text-align:center; }
  label { display:block; color:var(--muted); font-size:12px; margin-bottom:6px; }
  input { width:100%; background:var(--card2); border:var(--card-border); color:var(--tx);
    border-radius:9px; padding:11px; font-family:inherit; font-size:14px; margin-bottom:14px; box-shadow:var(--inset-sm); }
  input:focus-visible { outline:2px solid var(--focus-ring); outline-offset:2px; }
  button { width:100%; padding:12px; border:none; border-radius:11px; font-size:14px; font-weight:600;
    cursor:pointer; color:#fff; background:var(--accent); font-family:inherit; box-shadow:var(--raised-sm);
    transition:transform 160ms var(--ease-out), filter 150ms ease, box-shadow 140ms ease; }
  button:hover:not(:disabled) { filter:brightness(1.1); }
  button:focus-visible { outline:2px solid var(--focus-ring); outline-offset:2px; }
  button:active:not(:disabled) { transform:scale(.97); filter:brightness(1.05); }
  button:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }
  .err { color:var(--err); font-size:13px; min-height:18px; margin-top:10px; text-align:center; }
</style>
<script>
  (function(){ try{ if(localStorage.getItem('askue-theme')==='dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){} })();
</script>
</head>
<body>
  <div class="box">
    <button type="button" class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Светлая/тёмная тема" aria-label="Переключить тему"></button>
    <h1>АСКУЭ</h1>
    <form id="f">
      <label>Логин</label>
      <input id="username" autocomplete="username" required>
      <label>Пароль</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="btn">Войти</button>
      <div class="err" id="err"></div>
    </form>
  </div>
<script>
const THEME_ICON_SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="15" height="15" style="flex:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
const THEME_ICON_MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15" style="flex:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
function renderThemeToggleIcon() {
  const btn = document.getElementById('themeToggleBtn'); if (!btn) return;
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  btn.innerHTML = dark ? THEME_ICON_SUN : THEME_ICON_MOON;
}
function toggleTheme() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (dark) { document.documentElement.removeAttribute('data-theme'); } else { document.documentElement.setAttribute('data-theme', 'dark'); }
  try { localStorage.setItem('askue-theme', dark ? 'light' : 'dark'); } catch (e) {}
  renderThemeToggleIcon();
}
renderThemeToggleIcon();

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.error || 'Ошибка входа'; btn.disabled = false; return; }
    location.href = d.redirect || '/';
  } catch (e2) {
    err.textContent = 'Ошибка сети'; btn.disabled = false;
  }
});
</script>
</body>
</html>
