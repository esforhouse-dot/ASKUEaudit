server {
    server_name askue.o-dir.ru;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # P0-04 (2026-09-09) — три новых заголовка, остальное в этом server-блоке не менялось.
    #
    # Referrer-Policy: безопасный, ничего не ломающий дефолт — на cross-origin запросах уходит
    # только origin (не полный путь с query-параметрами), на same-origin — полный referrer как
    # раньше, на downgrade (https->http) — ничего. Современные браузеры и так уже применяют это
    # значение по умолчанию — здесь оно просто сделано явным.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Strict-Transport-Security: домен и так обслуживается только по HTTPS (см. редирект-блок
    # ниже, добавленный Certbot) — HSTS не меняет поведение сейчас, но фиксирует его на стороне
    # браузера на будущее (защита от даунгрейд-атак/опечатки в ссылке на http://). БЕЗ `preload`
    # — тот требует отдельной заявки в HSTS preload list и практически необратим (удаление из
    # списка занимает месяцы) — осознанно не включаю без отдельного решения владельца.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Content-Security-Policy: 'unsafe-inline' для script-src/style-src — ОБЯЗАТЕЛЬНО, не
    # компромисс по недосмотру. Фронтенд (index.html/admin.html/login.html/landing.html)
    # целиком построен на инлайновых <script>/<style> и onclick-обработчиках (см.
    # AUDIT/04_FRONTEND.md) — без 'unsafe-inline' (или полной переделки на nonce, что уже не
    # "добавить заголовок", а правка всех 4 HTML-файлов) приложение перестало бы работать.
    # Остальные директивы всё равно дают реальную защиту: внешние скрипты/стили только с 'self' +
    # Google Fonts (единственная сторонняя зависимость фронтенда, см. AUDIT), картинки — 'self'
    # и data: (загрузка фото лендинга), сетевые запросы — только 'self' (весь API — свой домен),
    # object-src полностью запрещён, base-uri/form-action заперты на 'self', frame-ancestors
    # дублирует X-Frame-Options современным механизмом.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/askue.o-dir.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/askue.o-dir.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = askue.o-dir.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name askue.o-dir.ru;
    return 404; # managed by Certbot


}
