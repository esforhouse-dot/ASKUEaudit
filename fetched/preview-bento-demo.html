<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Превью · bento «Модем»</title>
<style>
  :root {
    --bg:#0d1220; --card:#151c2b; --card2:#0f1626; --line:#26304a; --tx:#e8eef7;
    --muted:#8291ab; --accent:#3b82f6; --on:#33c37f; --off:#5b6b85; --err:#e35d5d;
    --warn:#e2a13a; --in:#38bdf8;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx);
    font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; padding:24px; }
  .wrap { max-width:1060px; margin:0 auto; }
  .sec-title { font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted);
    margin:22px 0 11px; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .kv { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .kv:last-child { border-bottom:none; }
  .kv .k { color:var(--muted); } .kv .v { font-weight:600; text-align:right; }

  .bars { display:flex; gap:3px; align-items:flex-end; height:26px; margin-top:6px; }
  .bars i { flex:1; background:var(--line); border-radius:2px; }
  .bars i.f { background:var(--on); }

  /* Bento-грид сводных показателей */
  .label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  .val { font-size:24px; font-weight:700; margin-top:4px; }
  .val small { font-size:13px; color:var(--muted); font-weight:500; }
  .bento { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; }
  .bento-primary { grid-column:span 3; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#5b93f7,#2f5fc9); border-radius:14px; padding:16px; color:#fff; }
  .bento-primary::before { content:''; position:absolute; inset:0;
    background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 1px,transparent 1px 11px);
    -webkit-mask-image:radial-gradient(ellipse 85% 55% at 100% 0%,#000 55%,transparent 100%);
    mask-image:radial-gradient(ellipse 85% 55% at 100% 0%,#000 55%,transparent 100%); pointer-events:none; }
  .bento-primary .label, .bento-primary .val small { color:rgba(255,255,255,.72); position:relative; }
  .bento-primary .val { font-size:28px; font-weight:700; margin-top:4px; position:relative; }
  .bento-primary .bars { height:26px; margin-top:6px; position:relative; }
  .bento-primary .bars i { background:rgba(255,255,255,.22); }
  .bento-primary .bars i.f { background:#fff; }
  .bento-tile { grid-column:span 2; }
  .bento-tile .val { font-size:26px; font-weight:700; margin-top:4px; }
  .bento-tile-sm { grid-column:span 1; }
  @media (max-width:600px) {
    .bento { grid-template-columns:1fr; }
    .bento-primary, .bento-tile, .bento-tile-sm { grid-column:span 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="sec-title">Состояние сети</div>
  <div class="bento">
    <div class="bento-primary">
      <div>
        <div class="label">Сигнал</div>
        <div class="val">61% <small>-75 dBm · CSQ 19</small></div>
      </div>
      <div class="bars">
        <i class="f" style="height:40%"></i>
        <i class="f" style="height:55%"></i>
        <i class="f" style="height:70%"></i>
        <i style="height:85%"></i>
        <i style="height:100%"></i>
      </div>
    </div>
    <div class="card bento-tile">
      <div class="label">Оператор / вышка</div>
      <div style="margin-top:8px">
        <div class="kv"><span class="k">Сеть</span><span class="v">Online</span></div>
        <div class="kv"><span class="k">PLMN</span><span class="v">250-20</span></div>
        <div class="kv"><span class="k">Диапазон</span><span class="v">777 DCS 1800</span></div>
        <div class="kv"><span class="k">Сота / LAC</span><span class="v">0x6989 / 11642</span></div>
      </div>
    </div>
    <div class="card bento-tile bento-tile-sm">
      <div class="label">Температура модуля</div>
      <div class="val">39 <small>°C</small></div>
    </div>
  </div>
</div>
</body>
</html>
